<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-Container">
        <h1>ADD NEW STUDENT</h1>
        <div class="container-Div">
            <input type="text" class="txtId" placeholder="Enter Your ID" id="txtId">
        </div>
        <div class="container-Div">>
            <input type="text" class="txtName" placeholder="Enter Your Name" id="txtName">
        </div>
        <div class="container-Div">>
            <input type="text" class="txtAge" placeholder="Enter Your Age" id="txtAge">
        </div>
        <div class="container-Div">>
            <input type="text" class="txtAddress" placeholder="Enter Your Address" id="txtAddress">
        </div>
        <div class="container-Div">
            <button onclick="btnAddStudent()">Add Student</button>
        </div>
        <div class="container-Div">>
            <a href="index.html"><button>Back To Menu</button></a>
        </div>
    </div>

    <script src="js/app.js"></script>
    
</body>
</html>
